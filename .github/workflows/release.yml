name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Zero ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download this version and install it.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Generate latest.json
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $sigFile = Get-ChildItem "src-tauri/target/release/bundle/nsis/Zero_${ver}_x64-setup.exe.sig" | Select-Object -First 1
          $sig = (Get-Content $sigFile.FullName -Raw).Trim()
          $pub = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $tag = "${{ github.ref_name }}"
          $obj = [ordered]@{
            version = $ver
            notes = "Zero $tag"
            pub_date = $pub
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = "https://github.com/wasaomen/FARST/releases/download/$tag/Zero_${ver}_x64-setup.exe"
              }
            }
          }
          $obj | ConvertTo-Json -Depth 5 | Out-File latest.json -Encoding utf8

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
